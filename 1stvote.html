<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voters' Age Validation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vast+Shadow&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url(https://chintan.indiafoundation.in/wp-content/uploads/2024/05/1-4-1024x576.png);
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .validation_form {
            width: 400px;
            background-image: linear-gradient(to bottom, rgba(255, 166, 0, 0.9), rgba(255, 255, 255, 0.9), rgba(0, 128, 0, 0.8));
            border-radius: 20px;
            box-shadow: 10px 10px 20px rgb(0, 0, 0);
            padding: 30px;
            text-align: center;
            position: relative;
        }

        /* Animation for the success content */
/*         @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        } */
                /* Success Pop-In Animation */
        @keyframes springUp {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .success-container {
            display: none;
            animation: springUp 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
/*         .success-container {
            display: none; /* Hidden by default */
          /*   animation: popIn 0.6s ease-out forwards;
        }  */

        .success-container img {
            width: 150px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            animation: floating 3s ease-in-out infinite;
        }

        .congrats-text {
            font-family: 'Times New Roman', Times, serif;
            color: #023d0b;
            font-weight: bold;
            font-size: 20px;
            line-height: 1.5;
        }

        .error {
            color: brown;
            height: 20px;
            font-size: 11px;
            font-family: "Vast Shadow", serif;
            margin-bottom: 5px;
        }

        input {
            height: 35px;
            width: 90%;
            background-color: rgb(252, 225, 181);
            border-radius: 10px;
            border: 2px solid rgb(218, 134, 9);
            margin-bottom: 5px;
            padding: 0 10px;
        }

        input[type="submit"] {
            cursor: pointer;
            width: 100%;
            background-color: rgb(237, 243, 174);
            font-weight: bold;
            margin-top: 10px;
        }
        input:focus{
            background-color: rgba(203, 250, 203, 0.98);
            color: black;
            outline: none;
            border-color: #048804;
        }
        h1 {
            text-shadow: 2px 2px 5px rgb(121, 100, 100);
            margin-top: 0;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="validation_form">
        <div id="form_section">
            <h1>Voters’ Age Validation</h1>
            <form id="validation_form">
                <input type="text" placeholder="Enter the voter name" id="name">
                <div class="error" id="nameerror"></div>

                <input type="date" id="age">
                <div class="error" id="ageerror"></div>

                <input type="text" placeholder="Enter your city" id="city">
                <div class="error" id="cityerror"></div>

                <input type="text" placeholder="Enter your ward" id="ward">
                <div class="error" id="warderror"></div>

                <input type="submit" value="Check Eligibility">
            </form>
        </div>

        <div class="success-container" id="success_section">
            <img src="d:\html_and_css\vote.jpeg" alt="Voter Icon">
            <div class="congrats-text" id="dynamic_message"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById("validation_form");
        const formSection = document.getElementById("form_section");
        const successSection = document.getElementById("success_section");
        const dynamicMsg = document.getElementById("dynamic_message");

        function getCalculatedAge(birthdayValue) {
            let birthDate = new Date(birthdayValue);
            let today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            let monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const nameValue = document.getElementById("name").value.trim();
            const dob = document.getElementById("age").value;
            const city = document.getElementById("city").value.trim();
            const ward = document.getElementById("ward").value.trim();

            const nameError = document.getElementById("nameerror");
            const ageError = document.getElementById("ageerror");
            const cityError = document.getElementById("cityerror");
            const wardError = document.getElementById("warderror");

            nameError.innerText = "";
            ageError.innerText = "";
            cityError.innerText = "";
            wardError.innerText = "";

            let isValid = true;

            if (nameValue === "") { nameError.innerText = "Name is required!"; isValid = false; }
            
            if (dob === "") { 
                ageError.innerText = "DOB required!"; 
                isValid = false; 
            } else {
                if (getCalculatedAge(dob) < 18) {
                    ageError.innerText = "Must be 18+ to vote!";
                    isValid = false;
                }
            }

            if (city === "") { cityError.innerText = "City is required!"; isValid = false; }
            if (ward === "") { wardError.innerText = "Ward is required!"; isValid = false; }

            if (isValid) {
                // Hide Form and Show Success
                formSection.style.display = "none";
                successSection.style.display = "block";
                
                // Set the specific message you asked for
                dynamicMsg.innerHTML = `<h3>Congrats ${nameValue}!</h3>
                    <p>After a long time of studying the condition <br>‘if age >18, eligible to vote; else not eligible,’ <br>you finally passed it and registered your first vote !</p>`;
            }
        });
    </script>
</body>
</html>
